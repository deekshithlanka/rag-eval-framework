# Experiment plan. Every experiment changes exactly one baseline field.
# Edit values here; run names are generated as "<field>=<value>".

baseline:
  chunk_size: 800            # characters
  chunk_overlap: 100         # characters
  embedding: gemini-embedding-001
  prompt: v1_basic
  top_k: 4
  generator_model: gemini-3.1-flash-lite
  judge_model: gemini-3.5-flash-lite   # newer model than the generator, so it is not grading itself
  temperature: null          # null = provider default; responses are cached for reproducibility

experiments:
  - name: "Experiment 1: chunk size"
    variable: chunk_size
    values: [400, 800, 1600]
  - name: "Experiment 2: embedding model"
    variable: embedding
    values: [gemini-embedding-001, bge-small-en-v1.5, tfidf]
  - name: "Experiment 3: prompt"
    variable: prompt
    values: [v1_basic, v2_grounded, v3_grounded_clarify]

# Pre-registered launch gates. Set before looking at any results; do not tune them to fit.
ship_gates:
  faithfulness_pass_rate: 0.90   # share of answers scoring 4+ on faithfulness
  relevance_pass_rate: 0.85      # answerable + ambiguous questions
  unanswerable_safe_rate: 0.80   # unanswerable questions with no invented facts
  false_abstention_rate: 0.10    # answerable questions the bot wrongly declined (max)
  retrieval_recall_at_k: 0.85    # golden source docs found in the top-k chunks

requests_per_minute: 12   # per model; Gemini free tier allows 15 for flash-lite models

# Optional: USD per 1M tokens, from https://ai.google.dev/gemini-api/docs/pricing
# Fill in to get cost per run in the report. Leave empty to report tokens only.
prices_per_million: {}
#  gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
